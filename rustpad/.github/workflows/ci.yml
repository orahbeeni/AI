name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0 python3
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: UI tests (Linux, headless)
        if: runner.os == 'Linux'
        run: RUSTPAD_BIN=target/release/rustpad python3 tests/ui/run_ui_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: rustpad-${{ matrix.os }}
          path: |
            target/release/rustpad
            target/release/rustpad.exe
          if-no-files-found: ignore
