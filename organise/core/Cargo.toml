[package]
name = "organise-core"
version = "0.1.0"
edition = "2021"
description = "Data model, plain-text storage and file-link tracking for Organise"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
gethostname = "0.5"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"

[dev-dependencies]
tempfile = "3"
