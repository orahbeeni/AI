[package]
name = "sketchframe"
version = "0.2.2"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", features = ["glow"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"
dirs = "6"
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
base64 = "0.22"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
