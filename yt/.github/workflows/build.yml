name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Same unit tests on every OS: they cover argument building, output parsing,
  # path handling, file-name safety and binary selection.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   name: linux-x64,     args: '' }
          - { os: windows-latest, name: windows-x64,   args: '' }
          - { os: macos-latest,   name: macos-arm64,   args: '--target aarch64-apple-darwin' }
          - { os: macos-13,       name: macos-x64,     args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}

      # A "portable" download: the app plus an empty marker file. Unzip anywhere
      # (a USB stick, say) and all data stays in a folder next to the app.
      - name: Make portable bundle
        shell: bash
        run: |
          out=portable/YTGrab
          mkdir -p "$out"
          touch "$out/portable"
          case "${{ runner.os }}" in
            Windows) cp src-tauri/target/release/ytgrab.exe "$out/YTGrab.exe" ;;
            Linux)   cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/YTGrab.AppImage" ;;
            macOS)   cp -R src-tauri/target/*/release/bundle/macos/*.app "$out/" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: YTGrab-portable-${{ matrix.name }}
          path: app/portable
      - uses: actions/upload-artifact@v4
        with:
          name: YTGrab-installer-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
