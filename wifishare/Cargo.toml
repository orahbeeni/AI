[package]
name = "wifishare"
version = "0.1.0"
edition = "2024"

[lib]
name = "wifishare"

[[bin]]
name = "wifishare"
required-features = ["desktop"]

[features]
default = ["desktop"]
# The computer app: window, input sharing, clipboard and sound. Without it only the networking,
# pairing and shared folders are built (for the Android app in android/wifishare).
desktop = ["dep:arboard", "dep:chacha20poly1305", "dep:clap", "dep:eframe", "dep:egui", "dep:png"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
dirs = "7.0.0"
eframe = { version = "0.36.2", optional = true }
egui = { version = "0.36.2", optional = true }
gethostname = "1.1.0"
getrandom = "0.3"
hex = "0.4.3"
if-addrs = "0.15.0"
log = { version = "0.4.34", features = ["std"] }
png = { version = "0.18.1", optional = true }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
toml = "1.1.8"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.18"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
