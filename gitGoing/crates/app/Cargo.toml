[package]
name = "gitgoing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gitgoing-core = { path = "../core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
rfd = "0.15"
png = { version = "0.17", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["wgpu", "snapshot"] }
# The test renderer turns on egui's accesskit; egui-winit has to be built to match (tests only).
egui-winit = { version = "0.31.1", default-features = false, features = ["accesskit"] }
tempfile = "3"
