[package]
name = "video"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.36.2"
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.154"
ureq = "3.5.1"

# Encoding is done by ffmpeg, but the UI should still be smooth in a plain `cargo run`.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
